name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/shop-api

jobs:
  # Первый параллельный этап: линтинг
  # Запускается на каждом пуше
  # Проверяет код на соответствие стандартам через ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linter
        run: pip install -r requirements-dev.txt
      
      - name: Run ruff
        run: ruff check .

  # Второй параллельный этап: unit-тесты
  # Запускается одновременно с lint
  # Проверяет корректность работы API через pytest
  # Сохраняет отчет о покрытии в artifacts
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run tests
        run: pytest test_app.py -v
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

  # Третий этап: сборка Docker-образа
  # Запускается только после успешного завершения lint и test (Diamond Pattern)
  # Собирает образ и сохраняет его для следующих этапов
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o shop-api.tar
      
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: shop-api.tar

  # Четвертый этап: интеграционные тесты
  # Запускается после успешной сборки образа
  # Поднимает контейнер и проверяет доступность эндпоинтов через curl
  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: Load Docker image
        run: docker load -i shop-api.tar
      
      - name: Run container
        run: docker run -d -p 5000:5000 --name shop-api ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Wait for container to start
        run: sleep 5
      
      - name: Test health endpoint
        run: |
          curl -f http://localhost:5000/health || exit 1
          echo "Health check passed"
      
      - name: Test products endpoint
        run: |
          curl -f http://localhost:5000/products || exit 1
          echo "Products endpoint passed"
      
      - name: Test single product endpoint
        run: |
          curl -f http://localhost:5000/products/1 || exit 1
          echo "Single product endpoint passed"
      
      - name: Test 404 handling
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/products/999)
          if [ "$response" != "404" ]; then
            echo "Expected 404, got $response"
            exit 1
          fi
          echo "404 handling test passed"
      
      - name: Stop container
        if: always()
        run: docker stop shop-api

  # Пятый этап: deploy в registry
  # Запускается только после успешного integration-test и только из ветки main
  # Пушит образ в Docker Hub с тегами latest и sha коммита
  deploy:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: Load Docker image
        run: docker load -i shop-api.tar
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Tag and push image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
